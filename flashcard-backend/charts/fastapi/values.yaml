replicaCount: 1

image:
  repository: gcr.io/flashcard-project-2025/fastapi-app
  tag: latest
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: api.34-36-11-18.nip.io
      paths:
        - path: /
          pathType: Prefix
  tls: []