name: Deploy to EC2 via SSM

on:
  push:
    branches:
      - main

permissions:
  id-token: write   # OIDC 토큰
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::209479288107:role/GitHubActions-DeployRole
          aws-region: ap-northeast-2

      - name: Send deploy command via SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=flashcard-server" \
            --query "Reservations[].Instances[].InstanceId" \
            --output text)

          echo "Target EC2 Instance: $INSTANCE_ID"

          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Flashcard app" \
            --parameters 'commands=[
              "cd /app/flashcard",
              "git pull origin dev",
              "docker compose down",
              "docker compose up -d --build"
            ]'