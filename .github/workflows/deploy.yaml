name: Trigger GCP Cloud Build

on:
  push:
    branches: [ dev ]

jobs:
  trigger-cloudbuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: flashcard-project-2025

      - name: Trigger Cloud Build
        run: |
          set -e
          COMMIT_MSG=$(git log -1 --pretty=%B | tr -d '\n')
          SHORT_SHA=$(git rev-parse --short "$GITHUB_SHA" 2>/dev/null || echo "manual-$(date +%s)")

          echo "COMMIT_MSG: $COMMIT_MSG"
          echo "SHORT_HASH: $SHORT_SHA"

          BUILD_OUTPUT=$(mktemp)
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions=_CLUSTER_NAME="flashcard-cluster",_CLUSTER_REGION="asia-northeast3-a",_PROJECT_ID="flashcard-project-2025",_FE_CHART_PATH="flashcard-frontend/charts/nextjs",_BE_CHART_PATH="flashcard-backend/charts/fastapi",_COMMIT_MSG="$COMMIT_MSG",_SHORT_SHA="$SHORT_SHA" \
            --service-account=projects/flashcard-project-2025/serviceAccounts/github-deployer@flashcard-project-2025.iam.gserviceaccount.com \
            --format='json' . | tee "$BUILD_OUTPUT"

          BUILD_ID=$(jq -r '.metadata.build.id // .id' "$BUILD_OUTPUT")
          if [[ -z "$BUILD_ID" || "$BUILD_ID" == "null" ]]; then
            echo "ERROR: No BUILD_ID received."
            exit 1
          fi

          echo "Build Logs: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=flashcard-project-2025"

          for i in {1..60}; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --format='value(status)' 2>/dev/null || echo "UNKNOWN")
            echo "Build status: $STATUS"
            if [[ "$STATUS" == "SUCCESS" ]]; then
              echo "Build succeeded"
              exit 0
            elif [[ "$STATUS" == "FAILURE" || "$STATUS" == "TIMEOUT" || "$STATUS" == "CANCELLED" ]]; then
              echo "Build failed: $STATUS"
              exit 1
            fi
            sleep 10
          done

          echo "Build timed out after 5 minutes."
          exit 1