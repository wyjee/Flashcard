name: Trigger GCP Cloud Build

on:
  push:
    branches: [ dev ]

jobs:
  trigger-cloudbuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: flashcard-project-2025
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Activate service account
        run: |
          echo "${{ secrets.GCP_SA_KEY }}" | base64 --decode > key.json
          gcloud auth activate-service-account --key-file=key.json
          ACCOUNT=$(gcloud config list account --format="value(core.account)")
          gcloud config set account "$ACCOUNT"

      - name: Trigger Cloud Build
        run: |
          echo "📍[PWD]:"
          pwd
          echo "📍[ls -al]:"
          ls -al
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions=_CLUSTER_NAME="flashcard-cluster",_CLUSTER_REGION="asia-northeast3",_PROJECT_ID="flashcard-project-2025",_FE_CHART_PATH="flashcard-frontend/charts/nextjs",_BE_CHART_PATH="flashcard-backend/charts/fastapi" \
            .