version: "3.8"

services:
  nginx:
    image: nginx:1.27
    container_name: flashcard-nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - internal_net
      - public_net

  backend:
    build: ./flashcard-backend
    container_name: flashcard-backend
    env_file: ./flashcard-backend/.env.prod
    expose:
      - "8000"
    networks:
      - internal_net
    depends_on:
      - redis

  frontend:
    build:
      context: ./flashcard-frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
    container_name: flashcard-frontend
    env_file: ./flashcard-frontend/.env.prod
    ports:
      - "3000"
    networks:
      - internal_net  # backend 통신
      - public_net    # 외부 접근 허용
    environment:
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend

  redis:
    image: redis:7
    container_name: flashcard-redis
    command: [ "redis-server", "--save", "60", "1", "--loglevel", "warning" ]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - internal_net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:

networks:
  internal_net:
    driver: bridge
  public_net:
    driver: bridge