substitutions:
  _CLUSTER_NAME: flashcard-cluster
  _CLUSTER_REGION: asia-northeast3
  _PROJECT_ID: flashcard-project-2025
  _FE_CHART_PATH: flashcard-frontend/charts/nextjs
  _BE_CHART_PATH: flashcard-backend/charts/fastapi

steps:
  - name: gcr.io/cloud-builders/gcloud
    id: get-credentials
    args:
      [
        "container", "clusters", "get-credentials", "${_CLUSTER_NAME}",
        "--region", "${_CLUSTER_REGION}",
        "--project", "${_PROJECT_ID}"
      ]

  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    entrypoint: bash
    args:
      - -c
      - |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if echo "$COMMIT_MSG" | grep -Eq "\[fe\]|\bfe\b|/fe"; then
          docker build --no-cache \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.34-22-91-115.nip.io \
            -t gcr.io/${_PROJECT_ID}/nextjs-app:$SHORT_SHA ./flashcard-frontend
          docker push gcr.io/${_PROJECT_ID}/nextjs-app:$SHORT_SHA
        fi

  - name: gcr.io/cloud-builders/docker
    id: build-backend
    entrypoint: bash
    args:
      - -c
      - |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if echo "$COMMIT_MSG" | grep -Eq "\[be\]|\bbe\b|/be"; then
          docker build --no-cache \
            -t gcr.io/${_PROJECT_ID}/fastapi-app:$SHORT_SHA ./flashcard-backend
          docker push gcr.io/${_PROJECT_ID}/fastapi-app:$SHORT_SHA
        fi

  - name: gcr.io/cloud-builders/helm
    id: deploy-frontend
    entrypoint: bash
    args:
      - -c
      - |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if echo "$COMMIT_MSG" | grep -Eq "\[fe\]|\bfe\b|/fe"; then
          helm upgrade flashcard-frontend ${_FE_CHART_PATH} \
            --install --set image.tag=$SHORT_SHA
        fi

  - name: gcr.io/cloud-builders/helm
    id: deploy-backend
    entrypoint: bash
    args:
      - -c
      - |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if echo "$COMMIT_MSG" | grep -Eq "\[be\]|\bbe\b|/be"; then
          helm upgrade flashcard-backend ${_BE_CHART_PATH} \
            --install --set image.tag=$SHORT_SHA
        fi

timeout: 1200s