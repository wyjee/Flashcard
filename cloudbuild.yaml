substitutions:
  _CLUSTER_NAME: "flashcard-cluster"
  _CLUSTER_REGION: "asia-northeast3-a"
  _PROJECT_ID: "flashcard-project-2025"
  _FE_CHART_PATH: "flashcard-frontend/charts/nextjs"
  _BE_CHART_PATH: "flashcard-backend/charts/fastapi"
  _COMMIT_MSG: "default"
  _SHORT_SHA: "default"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - name: gcr.io/cloud-builders/gcloud
    id: get-credentials
    args:
      [
        "container", "clusters", "get-credentials", "${_CLUSTER_NAME}",
        "--zone", "${_CLUSTER_REGION}",
        "--project", "${_PROJECT_ID}"
      ]

  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    entrypoint: bash
    args:
      - -c
      - |
        echo "📍frontend [PWD]: $(pwd)"
        ls -al
        if echo "${_COMMIT_MSG}" | grep -Eq "\[fe\]|\bfe\b|/fe"; then
          echo "✅ Detected frontend tag in commit message"
          docker build --no-cache \
            --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.34-22-91-115.nip.io \
            -t gcr.io/${_PROJECT_ID}/nextjs-app:${_SHORT_SHA} ./flashcard-frontend
          docker push gcr.io/${_PROJECT_ID}/nextjs-app:${_SHORT_SHA}
        else
          echo "ℹ️ Skipping frontend build (no [fe] tag)"
        fi

  - name: gcr.io/cloud-builders/docker
    id: build-backend
    entrypoint: bash
    args:
      - -c
      - |
        echo "📍backend [PWD]: $(pwd)"
        ls -al
        if echo "${_COMMIT_MSG}" | grep -Eq "\[be\]|\bbe\b|/be"; then
          echo "✅ Detected backend tag in commit message"
          docker build --no-cache \
            -t gcr.io/${_PROJECT_ID}/fastapi-app:${_SHORT_SHA} ./flashcard-backend
          docker push gcr.io/${_PROJECT_ID}/fastapi-app:${_SHORT_SHA}
        else
          echo "ℹ️ Skipping backend build (no [be] tag)"
        fi

  - name: gcr.io/cloud-builders/kubectl
    id: deploy-with-helm
    entrypoint: bash
    args:
      - -c
      - |
        curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

        if echo "${_COMMIT_MSG}" | grep -Eq "\[fe\]|\bfe\b|/fe"; then
          echo "🚀 Deploying frontend with Helm using tag: ${_SHORT_SHA}"
          helm upgrade flashcard-frontend ${_FE_CHART_PATH} \
            --install \
            --wait \
            --set image.repository=gcr.io/${_PROJECT_ID}/nextjs-app \
            --set image.tag=${_SHORT_SHA}
        else
          echo "ℹ️ Skipping frontend deployment"
        fi

        if echo "${_COMMIT_MSG}" | grep -Eq "\[be\]|\bbe\b|/be"; then
          echo "🚀 Deploying backend with Helm using tag: ${_SHORT_SHA}"
          helm upgrade flashcard-backend ${_BE_CHART_PATH} \
            --install \
            --wait \
            --set image.repository=gcr.io/${_PROJECT_ID}/fastapi-app \
            --set image.tag=${_SHORT_SHA}
        else
          echo "ℹ️ Skipping backend deployment"
        fi

timeout: 1200s